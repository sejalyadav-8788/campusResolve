<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusResolve - Student Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .brand {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #4f46e5;
            color: white;

            border-radius: 16px;

            font-size: 24px;
            font-weight: 800;

            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.25);
        }

        .brand h1 {
            color: #172033;
            font-size: 30px;
            margin-bottom: 5px;
        }

        .brand p {
            color: #64748b;
            font-size: 14px;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 18px;

            box-shadow:
                0 20px 45px rgba(15, 23, 42, 0.10);

            border: 1px solid #e2e8f0;
        }

        .login-title {
            color: #1e293b;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .login-subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #cbd5e1;
            border-radius: 9px;

            font-size: 15px;
            color: #1e293b;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px rgba(79, 70, 229, 0.10);
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 9px;

            background: #4f46e5;
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;

            margin-top: 5px;
        }

        button:hover {
            background: #4338ca;
            transform: translateY(-1px);

            box-shadow:
                0 8px 18px rgba(79, 70, 229, 0.22);
        }

        button:disabled {
            background: #a5b4fc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #message {
            display: none;

            margin-top: 16px;
            padding: 11px 12px;

            border-radius: 8px;

            background: #fef2f2;
            color: #dc2626;

            text-align: center;
            font-size: 14px;
        }

        .footer-text {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 22px;
        }

        @media (max-width: 480px) {

            .login-box {
                padding: 28px 22px;
            }

            .brand h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <!-- Brand -->
    <div class="brand">

        <div class="brand-icon">
            CR
        </div>

        <h1>CampusResolve</h1>

        <p>Campus grievance resolution platform</p>

    </div>


    <!-- Login Card -->
    <div class="login-box">

        <h2 class="login-title">
            Student Login
        </h2>

        <p class="login-subtitle">
            Sign in to submit and track your campus complaints.
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
            >
                Login to CampusResolve
            </button>

        </form>


        <div id="message"></div>

    </div>


    <p class="footer-text">
        CampusResolve • Making campus issues easier to resolve
    </p>

</div>


<script>

    const API_URL = "http://localhost:8080";


    document.getElementById("loginForm").addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            const loginButton =
                document.getElementById("loginButton");


            // Clear previous message
            message.innerText = "";
            message.style.display = "none";


            // Disable button while logging in
            loginButton.disabled = true;
            loginButton.innerText = "Signing in...";


            try {

                const response = await fetch(
                    API_URL + "/api/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                if (!response.ok) {

                    message.innerText =
                        "Invalid email or password.";

                    message.style.display = "block";

                    loginButton.disabled = false;
                    loginButton.innerText =
                        "Login to CampusResolve";

                    return;
                }


                const token =
                    await response.text();


                // Keep the existing backend authentication behavior
                localStorage.setItem(
                    "studentToken",
                    token
                );


                // Redirect to Student Dashboard
                window.location.href =
                    "dashboard.html";

            }


            catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                message.innerText =
                    "Cannot connect to the server. Please try again.";

                message.style.display =
                    "block";

                loginButton.disabled =
                    false;

                loginButton.innerText =
                    "Login to CampusResolve";
            }

        }
    );

</script>

</body>
</html>
