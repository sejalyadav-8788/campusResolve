<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusResolve - Authority Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1e293b;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #334155;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: red;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>CampusResolve</h1>

    <p class="subtitle">Authority Login</p>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter authority email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div id="message"></div>

</div>

<script>

    const API_URL = "http://localhost:8080";

    document.getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            try {

                const response = await fetch(
                    API_URL + "/api/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                if (!response.ok) {

                    message.innerText =
                        "Invalid email or password.";

                    return;
                }

                const token = await response.text();

                localStorage.setItem(
                    "authorityToken",
                    token
                );

                window.location.href =
                    "dashboard.html";

            } catch (error) {

                console.error(error);

                message.innerText =
                    "Cannot connect to the server.";
            }

        });

</script>

</body>
</html>
