<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusResolve | Admin Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top left,
                    #dbeafe,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #e0e7ff,
                    transparent 35%
                ),
                #f8fafc;

        }


        /* ================= CONTAINER ================= */

        .login-container {

            width: 100%;

            max-width: 430px;

        }


        /* ================= BRAND ================= */

        .brand {

            text-align: center;

            margin-bottom: 22px;

        }


        .brand-icon {

            width: 58px;
            height: 58px;

            margin: 0 auto 12px;

            border-radius: 15px;

            background: #2563eb;

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 20px;

            font-weight: 700;

            box-shadow:
                0 8px 20px rgba(
                    37,
                    99,
                    235,
                    0.25
                );

        }


        .brand h1 {

            color: #172554;

            font-size: 26px;

            letter-spacing: -0.4px;

        }


        .brand p {

            color: #64748b;

            font-size: 14px;

            margin-top: 5px;

        }


        /* ================= LOGIN CARD ================= */

        .login-box {

            background: rgba(
                255,
                255,
                255,
                0.97
            );

            padding: 34px;

            border-radius: 16px;

            border: 1px solid #e2e8f0;

            box-shadow:
                0 15px 40px
                rgba(
                    15,
                    23,
                    42,
                    0.10
                );

        }


        .login-heading {

            margin-bottom: 25px;

        }


        .login-heading h2 {

            font-size: 21px;

            color: #172033;

            margin-bottom: 6px;

        }


        .login-heading p {

            color: #64748b;

            font-size: 13px;

            line-height: 1.5;

        }


        /* ================= FORM ================= */

        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;

            color: #334155;

        }


        .input-wrapper {

            position: relative;

        }


        .input-icon {

            position: absolute;

            left: 13px;

            top: 50%;

            transform: translateY(-50%);

            color: #94a3b8;

            font-size: 15px;

            pointer-events: none;

        }


        input {

            width: 100%;

            padding:
                12px
                13px
                12px
                40px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 14px;

            color: #172033;

            background: white;

            outline: none;

            transition: 0.2s;

        }


        input::placeholder {

            color: #94a3b8;

        }


        input:focus {

            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px
                rgba(
                    59,
                    130,
                    246,
                    0.10
                );

        }


        /* ================= BUTTON ================= */

        .login-btn {

            width: 100%;

            padding: 12px;

            margin-top: 5px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;

        }


        .login-btn:hover {

            background: #1d4ed8;

            transform: translateY(-1px);

            box-shadow:
                0 5px 12px
                rgba(
                    37,
                    99,
                    235,
                    0.20
                );

        }


        .login-btn:disabled {

            background: #93c5fd;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;

        }


        /* ================= MESSAGE ================= */

        #message {

            min-height: 20px;

            margin-top: 14px;

            text-align: center;

            font-size: 13px;

            color: #dc2626;

        }


        /* ================= FOOTER ================= */

        .footer {

            text-align: center;

            margin-top: 18px;

            color: #94a3b8;

            font-size: 12px;

        }


        .footer span {

            color: #2563eb;

            font-weight: 600;

        }


        /* ================= MOBILE ================= */

        @media (max-width: 480px) {

            body {

                padding: 15px;

            }


            .login-box {

                padding: 26px 22px;

            }


            .brand h1 {

                font-size: 23px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- ================= BRAND ================= -->

    <div class="brand">

        <div class="brand-icon">
            CR
        </div>

        <h1>
            CampusResolve
        </h1>

        <p>
            Campus Grievance Resolution Platform
        </p>

    </div>



    <!-- ================= LOGIN ================= -->

    <div class="login-box">


        <div class="login-heading">

            <h2>
                Administrator Login
            </h2>

            <p>
                Sign in to monitor complaints,
                departments and campus-wide
                resolution activity.
            </p>

        </div>



        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Administrator Email
                </label>


                <div class="input-wrapper">

                    <span class="input-icon">
                        ✉
                    </span>


                    <input
                        type="email"
                        id="email"
                        placeholder="Enter administrator email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <div class="input-wrapper">

                    <span class="input-icon">
                        🔒
                    </span>


                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>



            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
                id="loginButton">

                Login to Admin Portal

            </button>


        </form>



        <div id="message"></div>


    </div>



    <!-- FOOTER -->

    <div class="footer">

        <span>CampusResolve</span>

        &nbsp;•&nbsp;

        Administrator Portal

    </div>


</div>



<script>


    /* ================= API ================= */

    const API_URL = "https://campusresolve-501n.onrender.com";



    /* ================= ELEMENTS ================= */

    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const message =
        document.getElementById(
            "message"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );



    /* ================= LOGIN ================= */

    loginForm.addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            message.innerText = "";


            loginButton.disabled = true;

            loginButton.innerText =
                "Signing in...";


            try {


                const response =
                    await fetch(

                        API_URL +
                        "/api/auth/login",

                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    email: email,

                                    password: password

                                })

                        }

                    );



                /* ================= ERROR ================= */

                if (!response.ok) {


                    if (
                        response.status === 401 ||
                        response.status === 403
                    ) {

                        throw new Error(
                            "Invalid email or password."
                        );

                    }


                    throw new Error(
                        "Login failed. Please try again."
                    );

                }



                /* ================= TOKEN ================= */

                const token =
                    await response.text();


                if (!token) {

                    throw new Error(
                        "No authentication token received."
                    );

                }



                /*
                 * IMPORTANT:
                 * Admin dashboard uses "token"
                 * so we keep the same key.
                 */

                localStorage.setItem(
                    "token",
                    token
                );



                /* ================= SUCCESS ================= */

                loginButton.innerText =
                    "Login successful ✓";


                window.location.href =
                    "dashboard.html";


            }

            catch (error) {


                console.error(error);


                if (
                    error instanceof TypeError
                ) {

                    message.innerText =
                        "Cannot connect to the server.";

                }

                else {

                    message.innerText =
                        error.message;

                }


                loginButton.disabled =
                    false;


                loginButton.innerText =
                    "Login to Admin Portal";


            }

        }

    );


</script>


</body>

</html>
